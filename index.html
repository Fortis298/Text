<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text</title>
  <link rel="stylesheet" href="normalization.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Быстро.</h>
  <h2>узнайте полную<br>статистику вашего текста</h2>
  
  <textarea class="text" placeholder="Введите текст..."></textarea>
  
  <section>
    <div class="words">
      <span>Слова</span>
      <p>...</p>
    </div>
    <div class="symbols">
      <span>Символы</span>
      <p>...</p>
    </div>
    <div class="no-spaces">
      <span>Символы без пробелов</span>
      <p>...</p>
    </div>
    <div class="sentences">
      <span>Предложения</span>
      <p>...</p>
    </div>
  </section>
  <script src="main.js"></script>
</body>
</html>
